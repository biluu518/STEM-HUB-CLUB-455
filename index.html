<style>
:root{--bg:#eef2fb;--card:#fff;--tx:#14213d;--mu:#6b7794;--pr:#4f46e5;--pr2:#06b6d4;--ok:#15803d;--bad:#dc2626;--bd:#e2e8f5;--sh:0 8px 28px rgba(40,60,140,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#151d36;--tx:#e8edf8;--mu:#97a3c2;--pr:#818cf8;--pr2:#22d3ee;--ok:#4ade80;--bad:#f87171;--bd:#26315a;--sh:0 8px 28px rgba(0,0,0,.35)}}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 400px at 10% -10%,rgba(79,70,229,.18),transparent),radial-gradient(800px 400px at 100% 0,rgba(6,182,212,.16),transparent),var(--bg);color:var(--tx);font:15px/1.55 "Poppins","Segoe UI",system-ui,Arial,sans-serif;min-height:100vh}
header{position:relative;overflow:hidden;background:radial-gradient(600px 300px at 50% 0,rgba(56,189,248,.35),transparent),linear-gradient(160deg,#071a4a 0%,#0b2f8f 55%,#0e7fc0 100%);color:#fff;padding:26px 16px 22px;text-align:center;box-shadow:0 10px 34px rgba(7,26,74,.45);border-bottom:4px solid #f5b942}
header:before,header:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
header:before{width:260px;height:260px;left:-90px;top:-80px;background:rgba(245,185,66,.14)}header:after{width:300px;height:300px;right:-110px;bottom:-140px;background:rgba(56,189,248,.18)}
header>*{position:relative;z-index:1}
.logo{width:min(66vw,290px);height:auto;display:block;margin:0 auto 6px;filter:drop-shadow(0 12px 28px rgba(0,0,0,.45)) drop-shadow(0 0 22px rgba(245,185,66,.35));animation:flt 5s ease-in-out infinite}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.school{font-family:"Playfair Display",Georgia,serif;font-size:clamp(20px,5.4vw,30px);font-weight:800;letter-spacing:.5px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.ttl{font-family:"Playfair Display",Georgia,serif;font-size:clamp(22px,6.2vw,34px);font-weight:900;margin:2px 0 4px;background:linear-gradient(90deg,#ffe29a,#f5b942,#ffe29a);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.6px}
.slg{font-style:italic;font-size:13.5px;opacity:.92;letter-spacing:.6px;margin-bottom:6px}
main{max-width:920px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--sh);animation:up .4s ease both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2,h3{margin:.2em 0 .5em;font-weight:700}.mu{color:var(--mu);font-size:13px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1.5px solid var(--bd);border-radius:10px;padding:10px 12px;width:100%;margin:4px 0;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(79,70,229,.18)}
button{width:auto;background:linear-gradient(120deg,var(--pr),var(--pr2));color:#fff;border:0;cursor:pointer;padding:10px 18px;font-weight:600;box-shadow:0 4px 12px rgba(79,70,229,.3)}button:hover{transform:translateY(-1px)}
button.g{background:var(--bg);color:var(--tx);border:1.5px solid var(--bd);box-shadow:none}button.r{background:var(--bad);box-shadow:none}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}nav button{background:var(--card);color:var(--tx);border:1.5px solid var(--bd);box-shadow:none;border-radius:30px}nav button.on{background:linear-gradient(120deg,var(--pr),var(--pr2));color:#fff;border:0}
.cdc{background:linear-gradient(135deg,#1e1b4b,#312e81 55%,#0e7490);color:#fff;border:0}.cdc .mu{color:#c7d2fe}
.cd{display:flex;gap:10px;justify-content:center;margin-top:8px}.cd div{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:10px 6px;min-width:70px;text-align:center;backdrop-filter:blur(6px)}.cd b{font-size:30px;display:block;font-variant-numeric:tabular-nums}.cd span{color:#c7d2fe;font-size:12px}
.cdc{padding:22px 12px 20px;text-align:center;position:relative;overflow:hidden;box-shadow:0 16px 44px rgba(30,27,75,.5);border:1px solid rgba(245,185,66,.5)}
.cdc:before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-80px;top:-90px;background:rgba(245,185,66,.14)}
.cdt{position:relative;font-family:"Playfair Display",Georgia,serif;font-size:clamp(18px,5vw,24px);font-weight:800;color:#f5b942}
.cdd{position:relative;font-size:13px;opacity:.92;margin:4px 0 14px}
.cd{gap:8px;position:relative}.cd div{min-width:0;flex:1;padding:14px 2px;background:rgba(255,255,255,.1);border:1px solid rgba(245,185,66,.4)}
.cd b{font-size:clamp(34px,10.5vw,54px);font-weight:800;line-height:1.05;background:linear-gradient(180deg,#fff,#ffe29a);-webkit-background-clip:text;background-clip:text;color:transparent}
.cd span{font-size:12px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:#c7d2fe}
.ft{text-align:center;color:var(--mu);font-size:12px;padding:10px 12px 30px}.ft b{color:var(--pr)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.stat h2{font-size:30px;margin:0;background:linear-gradient(120deg,var(--pr),var(--pr2));-webkit-background-clip:text;background-clip:text;color:transparent}
.opt{display:block;padding:11px 12px;border:1.5px solid var(--bd);border-radius:12px;margin:7px 0;cursor:pointer;transition:.15s}.opt:hover{border-color:var(--pr)}.opt.sel{border-color:var(--pr);background:rgba(79,70,229,.12)}.opt.ok{border-color:var(--ok);background:rgba(21,128,61,.14)}.opt.no{border-color:var(--bad);background:rgba(220,38,38,.12)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--pr2));border-radius:6px}
.tag{display:inline-block;background:rgba(79,70,229,.1);color:var(--pr);border-radius:20px;padding:2px 11px;font-size:12px;font-weight:600;margin-right:5px}
#timer{position:sticky;top:env(safe-area-inset-top,0px);background:linear-gradient(120deg,#dc2626,#f97316);color:#fff;padding:10px;text-align:center;font-weight:700;font-size:17px;border-radius:12px;z-index:5;margin-bottom:12px}
.drop{display:block;border:2px dashed var(--pr);border-radius:16px;padding:26px 12px;text-align:center;cursor:pointer;background:rgba(79,70,229,.06);transition:.2s;margin:8px 0}.drop:hover,.drop.on{background:rgba(79,70,229,.14);transform:scale(1.01)}.drop big{font-size:38px;display:block}.drop input{display:none}
.hero{background:linear-gradient(135deg,rgba(79,70,229,.14),rgba(6,182,212,.14))}
.rk{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;border:1px solid var(--bd);margin:8px 0;background:var(--bg)}.rk.me{border-color:var(--pr);box-shadow:0 0 0 2px rgba(79,70,229,.25)}
.rn{font-size:22px;min-width:40px;text-align:center;font-weight:800}.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.rm{flex:1;min-width:0}.rm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rs{font-size:20px;font-weight:800;color:var(--pr)}
#ethd{margin-top:6px;display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(245,185,66,.55);padding:3px 14px;border-radius:20px;font-size:13px;letter-spacing:0}
.tg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{aspect-ratio:1;border-radius:20px;color:#fff;padding:14px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;box-shadow:var(--sh);transition:.2s;position:relative;overflow:hidden;animation:up .4s ease both}
.tile:active{transform:scale(.96)}.tile:before{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.15)}
.ti{font-size:46px;text-align:right;position:relative}.tl{font-weight:800;font-size:17px;line-height:1.2;position:relative}.tc{font-size:12px;background:rgba(255,255,255,.22);padding:2px 10px;border-radius:12px;align-self:flex-start;position:relative}
.dev{margin-top:10px;font-size:12.5px;opacity:.95;font-weight:500}.dev b{display:inline;font-size:inherit;letter-spacing:0}
.au{margin:0 0 12px;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:30px;padding:8px 18px;font-weight:600;box-shadow:var(--sh)}.au.hide{display:none}
.au b{font-size:24px;color:var(--pr);font-variant-numeric:tabular-nums;font-weight:800}.dot{width:11px;height:11px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pl 1.6s infinite}
@keyframes pl{70%{box-shadow:0 0 0 11px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.btnl{display:inline-block;background:linear-gradient(120deg,var(--pr),var(--pr2));color:#fff;padding:12px 24px;border-radius:12px;text-decoration:none;font-weight:700}
.rc{background:linear-gradient(160deg,#16213b,#1f2d52);color:#fff;border-radius:22px;padding:22px 16px;text-align:center;box-shadow:0 18px 40px rgba(15,23,42,.35);margin-bottom:14px}
.rcav{width:96px;height:96px;border-radius:50%;margin:0 auto 10px;background:linear-gradient(135deg,#38bdf8,#6366f1);border:4px solid #38bdf8;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:800;font-family:"Playfair Display",Georgia,serif}
.rcn{font-size:21px;font-weight:800;letter-spacing:.3px;text-transform:uppercase}.rcs{color:#7dd3fc;margin-bottom:12px}
.rci{display:flex;justify-content:space-between;padding:7px 6px;color:#cbd5e1;font-size:14px;border-top:1px solid rgba(255,255,255,.12)}.rci b{color:#fff}
.rct{display:flex;gap:10px;margin-top:14px}.rct>div{flex:1;border-radius:14px;padding:12px 6px;background:linear-gradient(135deg,#2563eb,#4f46e5)}.rct>div+div{background:linear-gradient(135deg,#0ea5e9,#06b6d4)}
.rct span{display:block;font-size:12px;letter-spacing:1.6px;opacity:.9}.rct b{font-size:32px;font-weight:800}.rct small{opacity:.85}
.rsub{display:flex;align-items:center;gap:8px;justify-content:space-between;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0}
.rsv{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:6px 12px;font-family:ui-monospace,Menlo,monospace;font-size:18px;min-width:78px;text-align:center;font-weight:700}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:1px 7px;font-size:11px;margin:2px 3px 0 0}
.gal{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;-webkit-overflow-scrolling:touch}
.gal figure{flex:0 0 88%;margin:0;scroll-snap-align:center;position:relative;cursor:pointer}
.gal img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:16px;display:block;box-shadow:var(--sh)}
.gal figcaption{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;color:#fff;font-size:13px;font-weight:600;border-radius:0 0 16px 16px;background:linear-gradient(transparent,rgba(0,0,0,.72))}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;color:#fff;text-align:center}.lb img{max-width:100%;max-height:82vh;border-radius:10px}
.tg>*{min-width:0}.ut{aspect-ratio:1.5;border-radius:20px;background:linear-gradient(155deg,#ff5a1f 0%,#c2300d 52%,#3b1d4a 100%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:var(--sh);cursor:pointer;font-weight:700;font-size:17px;text-align:center;padding:8px;transition:.2s}.ut:active{transform:scale(.96)}.ut small{font-size:12px;font-weight:500;opacity:.85}
.sc{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:8px 8px 12px;box-shadow:var(--sh);cursor:pointer;transition:.2s;animation:up .4s ease both}.sc:active{transform:scale(.97)}.sc b{display:block;margin-top:8px;text-align:center;font-size:14px}
.tq{flex:0 0 86%;scroll-snap-align:center;background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:14px;position:relative}.tq:before{content:"“";position:absolute;right:12px;top:-4px;font-size:54px;color:var(--pr);opacity:.25;font-family:Georgia}.tstars{color:#f5b942;letter-spacing:2px;font-size:16px}
.nosel{user-select:none;-webkit-user-select:none}.hide{display:none}

/* ===== dark editorial theme ===== */
:root:root:root{--bg:#0a0f18;--card:#0f1623;--tx:#eef2f8;--mu:#93a0b5;--pr:#d7f46b;--pr2:#b8e14a;--ok:#4ade80;--bad:#f87171;--bd:#1e2a3d;--sh:none}
html,body{background:#0a0f18!important;color:var(--tx)}body{padding-bottom:98px;background-image:radial-gradient(700px 320px at 85% -80px,rgba(215,244,107,.10),transparent)!important}
#tb{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(10,15,24,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.tbl{display:flex;align-items:center;gap:10px;cursor:pointer}.tbl img{width:44px;height:44px;object-fit:contain}.tbl b{display:block;font-size:15px;letter-spacing:.4px;line-height:1.1}.tbl small{display:block;color:var(--mu);font-size:11px;letter-spacing:.4px}
.tbr{display:flex;gap:8px;align-items:center}#tbreg{white-space:nowrap;padding:11px 14px;font-size:14px}
button{background:var(--pr);color:#0a0f18;border:0;font-weight:700;box-shadow:none;border-radius:12px}button:hover{transform:none;filter:brightness(1.05)}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.r{background:var(--bad);color:#fff}
.mb{background:#121b2b!important;color:#fff!important;border:1px solid var(--bd)!important;width:46px;height:46px;padding:0!important;font-size:24px;line-height:1}
input,select,textarea{background:#0c1320;color:var(--tx);border:1px solid var(--bd)}input:focus,select:focus,textarea:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(215,244,107,.15)}
.card{background:var(--card);border:1px solid var(--bd);box-shadow:none;border-radius:16px;animation:none}
h1,h2,h3{letter-spacing:-.015em}
.tag{background:rgba(215,244,107,.1);color:var(--pr)}
.hero{background:linear-gradient(135deg,rgba(215,244,107,.10),rgba(215,244,107,.02))}
.opt.sel{border-color:var(--pr);background:rgba(215,244,107,.1)}.rk.me{border-color:var(--pr);box-shadow:none}
.btnl{background:var(--pr);color:#0a0f18}.stat h2{background:none;-webkit-text-fill-color:var(--pr);color:var(--pr)}
.bar i,.rk .av,.av{background:var(--pr)}.av{color:#0a0f18}
#ethd{display:inline-block;margin:10px 4px 2px;border:1px solid var(--bd);background:transparent;color:var(--mu);padding:3px 14px;border-radius:20px;font-size:12px}
.ti{display:none}.tile{justify-content:flex-end;gap:6px}.tile .tl{font-size:18px}
#bn{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:space-around;align-items:center;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(12,18,29,.97);backdrop-filter:blur(10px);border-top:1px solid var(--bd)}
#bn button{background:transparent;color:var(--mu);box-shadow:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:7px 8px;border-radius:12px;min-width:56px}
#bn button.on{color:var(--pr)}#bn button.cta{background:var(--pr);color:#0a0f18;padding:9px 16px}
#bn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lh{padding:24px 4px 8px}.eyebrow{color:var(--pr);font-size:12px;font-weight:700;letter-spacing:2.6px;text-transform:uppercase}
.lh h1{font-size:clamp(34px,10.5vw,54px);line-height:1.02;letter-spacing:-.03em;margin:14px 0;font-weight:700}
.lh h1 em{font-family:"Playfair Display",Georgia,serif;color:var(--pr);font-weight:600}
.lh p{color:var(--mu);font-size:16px;line-height:1.7;margin:0}
.lcta{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:20px 0 10px}.lcta button{padding:15px 24px;font-size:16px}.lcta a{color:var(--tx);font-weight:600;cursor:pointer}
.lart{width:min(78%,290px);display:block;margin:22px auto 6px;filter:drop-shadow(0 24px 44px rgba(215,244,107,.14))}
.feat{border-top:1px solid var(--bd);padding:14px 0}.feat b{display:block;font-size:17px;margin-bottom:4px}.feat span{color:var(--mu);line-height:1.6}
.cropm{position:fixed;inset:0;z-index:90;background:#05080d;padding:12px;display:flex;flex-direction:column}.menu{position:fixed;inset:0;z-index:80;background:rgba(5,8,13,.96);padding:18px 20px;display:flex;flex-direction:column;overflow:auto}
.menu button{background:transparent;color:var(--tx);text-align:left;font-size:21px;font-weight:600;padding:15px 4px;border-radius:0;border:0;border-bottom:1px solid var(--bd)}.menu button.x{color:var(--pr)}
